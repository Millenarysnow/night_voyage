<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>暗涌 · 序章网页</title>
  <style>
    /* 网页正文保持独立的深色纸面，外层窗口和桌面效果由 Godot 绘制。 */
    :root { color-scheme: dark; font-family: "Microsoft YaHei UI", sans-serif; background: #111924; color: #e9edf0; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #111924; }
    button, input { font: inherit; }
    button { cursor: pointer; }
    .bar { display: flex; align-items: center; gap: 12px; height: 54px; padding: 8px 14px; background: #1c2733; border-bottom: 1px solid #3f5261; }
    .brand { color: #f2b84b; font-weight: 700; letter-spacing: 1px; }
    .scope { border: 1px solid #4a6070; background: #17212b; color: #b8c7d0; border-radius: 4px; padding: 6px 11px; }
    .scope.active { border-color: #e7af45; color: #ffd981; background: #302a1c; }
    .search { display: flex; flex: 1; gap: 8px; }
    .search input { flex: 1; min-width: 80px; border: 1px solid #526778; border-radius: 4px; background: #0f1720; color: #f2f5f6; padding: 8px 10px; outline: none; }
    .search input:focus { border-color: #e7af45; }
    .search button, .action { border: 1px solid #d69f3e; border-radius: 4px; background: #dca63f; color: #17120a; padding: 7px 13px; font-weight: 700; }
    .search button:hover, .action:hover { background: #efbd59; }
    main { padding: 16px; }
    .hint { color: #93a7b4; font-size: 13px; margin: 0 0 12px; }
    .result { display: flex; justify-content: space-between; gap: 16px; padding: 14px; margin-bottom: 10px; background: #1a2631; border: 1px solid #3b4c5c; border-radius: 4px; }
    .result h3 { margin: 0 0 6px; color: #f0c66d; font-size: 16px; }
    .result p { margin: 0; line-height: 1.55; color: #c9d2d7; white-space: pre-line; }
    .result button { align-self: center; flex: 0 0 auto; }
    .page { max-width: 850px; margin: 0 auto; }
    .page h1 { margin: 0 0 6px; font-size: 23px; color: #f0c66d; }
    .meta { color: #8fa2af; font-size: 13px; margin-bottom: 18px; }
    .paper { padding: 18px 20px; background: #202c35; border-left: 3px solid #dca63f; border-radius: 3px; }
    .paper p { white-space: pre-line; line-height: 1.85; margin: 0; color: #e4e9eb; }
    .marked { margin-top: 18px; padding: 13px; border: 1px dashed #dca63f; background: #302a1b; color: #ffe6a3; }
    .marked small { display: block; color: #c2a56a; margin-bottom: 8px; }
    .actions { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
    .secondary { border: 1px solid #526778; border-radius: 4px; background: #18232d; color: #d4e0e5; padding: 7px 12px; }
    .secondary:hover { border-color: #dca63f; color: #ffe4a2; }
    .photo { display: block; width: min(100%, 380px); margin: 20px auto 4px; border: 1px solid #657783; cursor: pointer; }
    .caption { margin: 0; color: #90a4ae; text-align: center; font-size: 12px; }
    .post { max-width: 850px; margin: 0 auto; }
    .post .body { padding: 18px 20px; background: #202c35; border: 1px solid #3b4c5c; border-radius: 4px; white-space: pre-line; line-height: 1.85; }
    .floor { padding: 12px 15px; border-bottom: 1px solid #344452; color: #becbd2; white-space: pre-line; }
    .floor b { display: block; color: #e7b859; margin-bottom: 3px; }
    .empty { padding: 38px 12px; text-align: center; color: #879ba7; border: 1px dashed #3b4c5c; }
    .back { border: 0; background: transparent; color: #a9bac3; padding: 4px 0; margin-bottom: 12px; }
    .back:hover { color: #f0c66d; }
    .selection-pop { position: fixed; z-index: 20; display: none; padding: 7px; border: 1px solid #dca63f; border-radius: 4px; background: #111a25; box-shadow: 0 6px 24px #0009; }
    .selection-pop button { border: 1px solid #d69f3e; border-radius: 4px; background: #dca63f; color: #17120a; padding: 7px 12px; font-weight: 700; }
  </style>
</head>
<body>
  <header class="bar">
    <span class="brand">暗涌</span>
    <button class="scope active" data-scope="web">全网</button>
    <button class="scope" data-scope="forum">论坛</button>
    <form class="search" id="searchForm">
      <input id="query" autocomplete="off" placeholder="搜点什么……">
      <button type="submit">搜索</button>
    </form>
  </header>
  <main id="app"></main>
  <div class="selection-pop" id="selectionPop"><button id="collectSelection">收进白板</button></div>
  <script>
    // 只把玩家意图转成结构化消息，任何剧情判断都交给 Godot 的 C++ 状态机。
    let currentScope = "web";
    let snapshot = null;
    let appliedRevision = -1;
    let selectedText = "";
    let selectedPage = "";
    const app = document.getElementById("app");
    const queryInput = document.getElementById("query");
    const selectionPop = document.getElementById("selectionPop");

    function send(action, payload = {}) {
      const message = { version: 1, type: "action", request_id: "web-" + Date.now(), page: "prologue", action, payload };
      if (window.sendIpcMessage) window.sendIpcMessage(JSON.stringify(message));
    }

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>\"]/g, (ch) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'\"':"&quot;"}[ch]));
    }

    function resultCard(result) {
      const buttonAction = result.kind === "article" ? "open_article" : result.kind === "forum" ? "open_forum" : "open_result";
      const buttonText = result.kind === "article" ? "打开启事" : result.kind === "forum" ? "打开帖子" : "打开网页";
      return `<article class="result"><div><h3>${escapeHtml(result.title)}</h3><p>${escapeHtml(result.description)}</p></div><button class="action" data-action="${buttonAction}" data-id="${escapeHtml(result.id)}">${buttonText}</button></article>`;
    }

    function renderSearch() {
      const results = snapshot?.search_results ?? [];
      app.innerHTML = `<p class="hint">${results.length ? "搜索结果" : "没有找到相关结果"}</p>${results.length ? results.map(resultCard).join("") : `<div class="empty">换一个关键词试试。</div>`}`;
    }

    function renderArticle() {
      const article = snapshot.content.article;
      app.innerHTML = `<div class="page"><button class="back" data-page="search_results">‹ 返回搜索结果</button><h1>${escapeHtml(article.title)}</h1><div class="meta">${escapeHtml(article.short_source)} · 10 月 15 日</div><img class="photo" src="${escapeHtml(article.image)}" alt="年糕在家里的照片" data-preview="article"><p class="caption">${escapeHtml(article.image_caption)} · 点击放大</p><div class="paper"><p>${escapeHtml(article.body)}</p></div></div>`;
    }

    function renderForum() {
      const forum = snapshot.content.forum;
		const closingFloor = snapshot.complete ? `<div class="floor"><b>小满</b>找到了。\n\n猫主人来领走了。说是跑出去两天，躲在老粮站后头那片棚子里，饿了，一见人就往怀里钻。\n\n谢谢各位帮着出主意。</div>` : "";
		app.innerHTML = `<div class="post"><button class="back" data-page="forum_results">‹ 返回论坛结果</button><h1>${escapeHtml(forum.title)}</h1><div class="meta">${escapeHtml(forum.short_source)} · 小满 · 1 小时前</div><div class="body">${escapeHtml(forum.body)}</div><img class="photo" src="${escapeHtml(forum.image)}" alt="路口捡到的猫" data-preview="forum_post"><p class="caption">${escapeHtml(forum.image_caption)} · 点击放大</p><div class="floor"><b>三点半</b>大白天捡猫。会不会是猫妖啊。</div><div class="floor"><b>风过无痕</b>这么可爱，别乱说啊。</div><div class="floor"><b>小满</b>楼上两位先别聊妖怪了，帮我想想谁家丢了猫啊。</div><div class="floor"><b>咸鱼老王</b>南山路口那一片老房子多，养猫的人家不少呢。</div>${closingFloor}</div>`;
    }

    function renderGeneralPage() {
      const result = (snapshot.search_results ?? []).find((item) => item.id === snapshot.active_result_id);
      if (!result) {
        app.innerHTML = `<div class="empty">网页暂时无法显示。</div>`;
        return;
      }
      app.innerHTML = `<div class="page"><button class="back" data-page="search_results">‹ 返回搜索结果</button><h1>${escapeHtml(result.title)}</h1><div class="meta">全网搜索 · 普通网页</div><div class="paper"><p>${escapeHtml(result.description)}\n\n页面暂时没有更多内容。</p></div></div>`;
    }

    function render() {
      if (!snapshot) return;
      if (snapshot.page === "article") renderArticle();
      else if (snapshot.page === "forum_post") renderForum();
      else if (snapshot.page === "web_result") renderGeneralPage();
      else renderSearch();
    }

    document.addEventListener("click", (event) => {
      const target = event.target.closest("button, img[data-preview]");
      if (!target) return;
      if (target.dataset.scope) {
        currentScope = target.dataset.scope;
        document.querySelectorAll(".scope").forEach((node) => node.classList.toggle("active", node.dataset.scope === currentScope));
        return;
      }
      if (target.dataset.action) {
        send(target.dataset.action, { id: target.dataset.id });
        return;
      }
      if (target.dataset.collect) {
        const isArticle = target.dataset.collect === "article-text";
        send("collect_clue", { page: isArticle ? "article" : "forum_post", kind: "text", text: target.dataset.text });
        return;
      }
      if (target.dataset.preview) {
        send("preview_image", { page: target.dataset.preview === "article" ? "article" : "forum_post" });
        return;
      }
      if (target.dataset.page) {
        send("browser_navigate", { page: target.dataset.page });
      }
    });

    document.getElementById("searchForm").addEventListener("submit", (event) => {
      event.preventDefault();
      send("search", { scope: currentScope, query: queryInput.value });
    });

    // 页面正文的文字必须由玩家亲手拖选，再按浮出的按钮收录。
    document.addEventListener("mouseup", () => {
      const selection = window.getSelection();
      const text = selection?.toString().trim() ?? "";
      const anchor = selection?.anchorNode;
      const anchorElement = anchor instanceof Element ? anchor : anchor?.parentElement;
      const source = anchorElement?.closest(".paper p, .post .body");
      if (!source || text.length === 0 || text.length > 600) {
        selectionPop.style.display = "none";
        selectedText = "";
        selectedPage = "";
        return;
      }
      selectedText = text;
      selectedPage = source.closest(".page") ? "article" : "forum_post";
      const rect = selection.getRangeAt(0).getBoundingClientRect();
      selectionPop.style.display = "block";
      selectionPop.style.left = Math.max(8, Math.min(rect.left, window.innerWidth - 180)) + "px";
      selectionPop.style.top = Math.min(rect.bottom + 8, window.innerHeight - 48) + "px";
    });

    document.getElementById("collectSelection").addEventListener("click", () => {
      if (!selectedPage || !selectedText) return;
      send("collect_clue", { page: selectedPage, kind: "text", text: selectedText });
      selectionPop.style.display = "none";
      selectedText = "";
      selectedPage = "";
      window.getSelection()?.removeAllRanges();
    });

    // Godot 每次状态变更都把完整快照发回，网页只负责根据快照重画当前页面。
    window.onIpcMessage = function (raw) {
      try {
        const message = typeof raw === "string" ? JSON.parse(raw) : raw;
        if (message.type === "state") {
          const incomingRevision = Number(message.revision ?? message.snapshot?.revision ?? -1);
          // CEF 消息可能异步乱序，旧快照不能覆盖已经显示的新进度。
          if (!Number.isFinite(incomingRevision) || incomingRevision < appliedRevision) return;
          appliedRevision = incomingRevision;
          snapshot = message.snapshot;
          selectionPop.style.display = "none";
          render();
          // 等本地照片完成解码后回执，让 Godot 可以检查素材是否真正显示。
          Promise.all(Array.from(document.querySelectorAll("img.photo")).map((photo) => photo.decode().catch(() => null)))
            .then(() => window.sendIpcMessage(JSON.stringify({
              type: "browser:state_applied",
              page: snapshot.page,
              clue_count: snapshot.clues.length,
              article_text_collected: snapshot.milestones.article_text_collected,
              article_image_collected: snapshot.milestones.article_image_collected,
              article_image_width: document.querySelector(".page img.photo")?.naturalWidth ?? 0,
              forum_image_width: document.querySelector(".post img.photo")?.naturalWidth ?? 0
            })));
        }
      } catch (error) {
        app.innerHTML = `<div class="empty">网页状态读取失败。</div>`;
      }
    };

    window.sendIpcMessage("prologue:ready");
  </script>
</body>
</html>
